[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foresight-backend"
version = "1.0.0"
description = "Foresight AI - Network Attack Forecasting Platform Core API & ML Pipeline"
authors = [
    { name = "Foresight Architecture Team", email = "core@foresight-ai.internal" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "pyjwt>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "numpy>=2.0.0",
    "pandas>=2.2.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]
asyncio_mode = "auto"
