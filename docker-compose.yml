version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foresight_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://foresight:foresight_secret@postgres:5432/foresight_db
      - SECRET_KEY=change-this-in-production-docker-secret-32-chars
      - BACKEND_CORS_ORIGINS=["http://localhost:3000"]
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__
    networks:
      - foresight_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foresight_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - foresight_net

  postgres:
    image: postgres:16-alpine
    container_name: foresight_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: foresight
      POSTGRES_PASSWORD: foresight_secret
      POSTGRES_DB: foresight_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foresight -d foresight_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - foresight_net

  redis:
    image: redis:7-alpine
    container_name: foresight_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - foresight_net

networks:
  foresight_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
